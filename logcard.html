<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Card Library — Components Bay</title>
    <link rel="stylesheet" href="modern-style.css">
    <style>
        .lc-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
        .lc-table { width:100%; border-collapse:collapse; font-size:13px; }
        .lc-table th { background:var(--bg-secondary); color:var(--text-secondary); font-size:10px; text-transform:uppercase; letter-spacing:.05em; padding:10px 12px; border-bottom:2px solid var(--border); text-align:left; }
        .lc-table td { padding:10px 12px; border-bottom:1px solid var(--border); color:var(--text-primary); vertical-align:middle; }
        .lc-table tr:hover td { background:var(--bg-secondary); }
        .empty-state { text-align:center; padding:60px 20px; color:var(--text-secondary); }
        .filter-bar { display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
        .filter-bar input, .filter-bar select { padding:6px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; background:var(--bg-primary); color:var(--text-primary); }
        .count-badge { background:var(--accent); color:#fff; border-radius:12px; padding:2px 8px; font-size:12px; font-weight:600; margin-left:8px; }
        .lc-view-btn { background:#17a2b8; color:#fff; border:none; padding:4px 10px; border-radius:4px; cursor:pointer; font-size:12px; text-decoration:none; }
        .lc-del-btn { background:#e74c3c; color:#fff; border:none; padding:4px 10px; border-radius:4px; cursor:pointer; font-size:12px; }
        .lc-wh-btn { background:#e67e22; color:#fff; border:none; padding:4px 10px; border-radius:4px; cursor:pointer; font-size:12px; }
        .upload-form { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; align-items:end; margin-bottom:8px; }
        .upload-form .form-group { margin:0; }
        .module-badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; background:#2c3e50; color:#fff; }
        .manual-badge { background:#17a2b8; }
        .src-badge { background:#7c3aed; }
    </style>
</head>
<body>
<div class="container">
    <div class="lc-header">
        <div>
            <h1 style="margin:0;font-size:22px;">📋 Log Card Library</h1>
            <p style="margin:4px 0 0;color:var(--text-secondary);font-size:13px;">All log cards — from modules + manual uploads</p>
        </div>
        <a href="index.html" class="btn" style="font-size:13px;">← Back to Main</a>
    </div>

    <!-- Upload form -->
    <div class="card" style="margin-bottom:20px;">
        <h3 style="margin:0 0 16px;color:#17a2b8;font-size:15px;">➕ Add a Log Card (manual)</h3>
        <div class="upload-form">
            <div class="form-group">
                <label>Part Number (P/N) *</label>
                <input type="text" id="lcPartNumber" class="form-control" placeholder="Enter P/N">
            </div>
            <div class="form-group">
                <label>Serial Number (S/N) *</label>
                <input type="text" id="lcSerialNumber" class="form-control" placeholder="Enter S/N">
            </div>
            <div class="form-group">
                <label>Designation (optional)</label>
                <input type="text" id="lcDesignation" class="form-control" placeholder="Designation">
            </div>
            <div class="form-group">
                <label>Log Card PDF *</label>
                <input type="file" id="lcFile" accept=".pdf" class="form-control" style="padding:5px;">
            </div>
        </div>
        <button onclick="addLogCard()" class="btn btn-success" style="margin-top:12px;">💾 Save Log Card</button>
        <span id="lcMessage" style="margin-left:12px;font-size:13px;"></span>
    </div>

    <!-- Library -->
    <div class="card">
        <div class="filter-bar">
            <select id="filterSource" onchange="applyFilters()">
                <option value="">All sources</option>
                <option value="Manual">Manual only</option>
                <option value="Module">Modules only</option>
            </select>
            <input type="text" id="filterSearch" placeholder="Search P/N, S/N, designation..." oninput="applyFilters()" style="min-width:260px;">
            <span id="countBadge" class="count-badge">0</span>
        </div>
        <div id="lcContent"><div class="empty-state">⏳ Loading...</div></div>
    </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL = 'https://nwidtkiteamvnomewjux.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53aWR0a2l0ZWFtdm5vbWV3anV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzMTM3MDAsImV4cCI6MjA4Njg4OTcwMH0.fvKwq5B8Bdr2Hv67yvB6JRKA2Gu3xTIEgPmcmJj0nvI';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const MODULE_TABLES = [
    { table: 'efs',           label: 'EFS' },
    { table: 'efs_cylinders', label: 'EFS Cyl.' },
    { table: 'liferafts',     label: 'Life Raft' },
    { table: 'wheels',        label: 'Wheel' },
    { table: 'maintenance',   label: 'Maintenance' },
    { table: 'composite',     label: 'Composite' },
    { table: 'engine',        label: 'Engine' },
    { table: 'rotorbay',      label: 'Rotor Bay' },
    { table: 'troopseats',    label: 'Troop Seat' },
    { table: 'iafteaft',      label: 'IAFT/EAFT' },
    { table: 'avionic',       label: 'Avionic' },
];

let allCards = [];

async function loadCards() {
    allCards = [];

    // 1. Manual log cards
    try {
        const { data } = await sb.from('logcards').select('*').order('created_at', { ascending: false });
        (data || []).forEach(row => {
            const d = row.data || {};
            allCards.push({
                id: row.id, source: 'Manual', moduleLabel: 'Manual',
                partNumber: d.partNumber || '', serialNumber: d.serialNumber || '',
                designation: d.designation || '', url: d.url || '',
                date: row.created_at || '', isManual: true,
            });
        });
    } catch(e) { console.warn('logcards table:', e); }

    // 2. Module pieces that have a logcardUrl
    for (const t of MODULE_TABLES) {
        try {
            const { data } = await sb.from(t.table).select('*');
            (data || []).forEach(row => {
                const d = row.data || {};
                if (d.logcardUrl && d.logcardUrl.trim() !== '') {
                    allCards.push({
                        id: row.id, source: 'Module', moduleLabel: t.label, table: t.table,
                        partNumber: d.partNumber || d.pnWheel || d.pnTire || '',
                        serialNumber: d.serialNumber || '',
                        designation: d.designation || d.description || '',
                        url: d.logcardUrl, date: row.updated_at || row.created_at || '',
                        isManual: false,
                    });
                }
            });
        } catch(e) { console.warn(`${t.table}:`, e); }
    }

    renderTable(allCards);
}

window.addLogCard = async function() {
    const pn = document.getElementById('lcPartNumber').value.trim();
    const sn = document.getElementById('lcSerialNumber').value.trim();
    const desig = document.getElementById('lcDesignation').value.trim();
    const fileInput = document.getElementById('lcFile');
    const msg = document.getElementById('lcMessage');

    if (!pn || !sn) { msg.textContent = '❌ P/N and S/N are required'; msg.style.color = '#e74c3c'; return; }
    if (!fileInput.files || !fileInput.files[0]) { msg.textContent = '❌ Please select a PDF'; msg.style.color = '#e74c3c'; return; }

    msg.textContent = '⏳ Uploading...'; msg.style.color = '#666';
    try {
        const file = fileInput.files[0];
        const filePath = `logcards/${Date.now()}_${file.name}`;
        const { error: upErr } = await sb.storage.from('documents').upload(filePath, file);
        if (upErr) throw upErr;
        const { data: urlData } = sb.storage.from('documents').getPublicUrl(filePath);

        const id = Date.now().toString();
        const { error: dbErr } = await sb.from('logcards').insert({
            id, data: { partNumber: pn, serialNumber: sn, designation: desig, url: urlData.publicUrl },
            created_at: new Date().toISOString()
        });
        if (dbErr) throw dbErr;

        msg.textContent = '✅ Log card saved!'; msg.style.color = '#27ae60';
        document.getElementById('lcPartNumber').value = '';
        document.getElementById('lcSerialNumber').value = '';
        document.getElementById('lcDesignation').value = '';
        fileInput.value = '';
        await loadCards();
        setTimeout(() => { msg.textContent = ''; }, 3000);
    } catch(e) {
        msg.textContent = '❌ Error: ' + e.message; msg.style.color = '#e74c3c';
    }
};

window.deleteLogCard = async function(id) {
    if (!confirm('Delete this log card?')) return;
    try { await sb.from('logcards').delete().eq('id', id); await loadCards(); }
    catch(e) { alert('Error: ' + e.message); }
};

// Send a manual logcard piece to warehouse (stays in logcards too)
window.sendToWarehouseFromLogcard = async function(id) {
    const card = allCards.find(c => c.id === id && c.isManual);
    if (!card) return;
    if (!confirm('Send this piece to Warehouse? (it stays in Log Card too)')) return;
    try {
        // Create a warehouse entry in the "logcards_warehouse" style — store in a dedicated table 'warehouse_manual'
        await sb.from('warehouse_manual').insert({
            id: 'wm_' + Date.now(),
            data: {
                partNumber: card.partNumber, serialNumber: card.serialNumber,
                designation: card.designation, logcardUrl: card.url,
                sentToWarehouse: true, serviceability: 'Unserviceable',
                fromLogcard: true,
            },
            created_at: new Date().toISOString()
        });
        alert('✅ Sent to Warehouse (kept in Log Card)');
    } catch(e) { alert('Error: ' + e.message + '\n\nMake sure the "warehouse_manual" table exists.'); }
};

window.applyFilters = function() {
    const src = document.getElementById('filterSource').value;
    const search = document.getElementById('filterSearch').value.toLowerCase();
    const filtered = allCards.filter(c => {
        const matchSrc = !src || c.source === src;
        const matchSearch = !search ||
            (c.partNumber||'').toLowerCase().includes(search) ||
            (c.serialNumber||'').toLowerCase().includes(search) ||
            (c.designation||'').toLowerCase().includes(search);
        return matchSrc && matchSearch;
    });
    renderTable(filtered);
};

function renderTable(cards) {
    document.getElementById('countBadge').textContent = cards.length;
    const el = document.getElementById('lcContent');
    if (cards.length === 0) { el.innerHTML = '<div class="empty-state">📭 No log cards yet</div>'; return; }
    const rows = cards.map(c => {
        const date = c.date ? new Date(c.date).toLocaleDateString('fr-FR') : '-';
        const badge = c.isManual
            ? '<span class="module-badge manual-badge">Manual</span>'
            : `<span class="module-badge src-badge">${c.moduleLabel}</span>`;
        const actions = c.isManual
            ? `<button class="lc-wh-btn" onclick="sendToWarehouseFromLogcard('${c.id}')">📦 Warehouse</button>
               <button class="lc-del-btn" onclick="deleteLogCard('${c.id}')" style="margin-left:5px;">🗑</button>`
            : '<span style="color:#aaa;font-size:11px;">read-only</span>';
        return `<tr>
            <td>${badge}</td>
            <td style="font-family:monospace;font-size:12px;">${c.partNumber || '—'}</td>
            <td style="font-family:monospace;font-size:12px;">${c.serialNumber || '—'}</td>
            <td>${c.designation || '—'}</td>
            <td>${c.url ? `<a href="${c.url}" target="_blank" class="lc-view-btn">📄 View</a>` : '—'}</td>
            <td style="color:var(--text-secondary);font-size:12px;">${date}</td>
            <td>${actions}</td>
        </tr>`;
    }).join('');
    el.innerHTML = `<table class="lc-table">
        <thead><tr><th>Source</th><th>P/N</th><th>S/N</th><th>Designation</th><th>Log Card</th><th>Date</th><th>Action</th></tr></thead>
        <tbody>${rows}</tbody>
    </table>`;
}

loadCards();
</script>
</body>
</html>
