<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Components Bay</title>
    <link rel="stylesheet" href="modern-style.css">
    <script type="module" src="supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .chart-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }
        .chart-card h3 {
            font-size: 14px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-wrapper {
            position: relative;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chart-center-label {
            position: absolute;
            text-align: center;
            pointer-events: none;
        }
        .chart-center-label .total {
            font-size: 24px;
            font-weight: 700;
            color: #1e293b;
            line-height: 1;
        }
        .chart-center-label .label {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
        }
        .chart-legend {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 12px;
            font-size: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .stat-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .stat-card .stat-value {
            font-size: 32px;
            font-weight: 700;
            line-height: 1;
        }
        .stat-card .stat-label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-card.red .stat-value { color: #e74c3c; }
        .stat-card.orange .stat-value { color: #f39c12; }
        .stat-card.green .stat-value { color: #27ae60; }
        .stat-card.blue .stat-value { color: #2980b9; }

        .within90-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .within90-table th { background: #f8fafc; padding: 10px 12px; text-align: left; font-weight: 600; color: #475569; font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 2px solid #e2e8f0; }
        .within90-table td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; }
        .within90-table tr:hover td { background: #f8fafc; }
        .days-badge { padding: 3px 8px; border-radius: 20px; font-weight: 600; font-size: 12px; }
        .days-red { background: #fdecea; color: #c62828; }
        .days-orange { background: #fff3e0; color: #e65100; }
        .days-green { background: #e8f5e9; color: #2e7d32; }
        .module-badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; background: #e2e8f0; color: #475569; }
        .loading-overlay { display: flex; align-items: center; justify-content: center; height: 200px; color: #94a3b8; font-size: 14px; }
    </style>
</head>
<body>
    <div class="main-header" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);">
        <div style="display:flex;align-items:center;gap:15px;">
            <a href="index.html" class="nav-btn">🏠 Home</a>
            <div>
                <div style="font-size:20px;font-weight:700;">📊 Dashboard</div>
                <div style="font-size:12px;opacity:0.7;">Fleet health overview</div>
            </div>
        </div>
        <span id="userInfo" class="nav-btn user-btn"></span>
    </div>

    <div class="container" style="padding: 24px 20px; max-width: 1400px; margin: 0 auto;">

        <!-- Global Stats -->
        <div class="stat-row" id="statRow">
            <div class="loading-overlay">Loading data...</div>
        </div>

        <!-- Charts Grid -->
        <div style="margin-bottom:10px;font-size:13px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.5px;">Serviceability by Module</div>
        <div class="dashboard-grid" id="chartsGrid">
            <div class="loading-overlay">Loading charts...</div>
        </div>

        <!-- Within 90 Days -->
        <div class="chart-card" style="margin-top:10px;">
            <h3>⏰ Inspections Due Within 90 Days <span class="badge" id="within90Badge" style="margin-left:8px;">0</span></h3>
            <div id="within90Content"><div class="loading-overlay">Loading...</div></div>
        </div>

    </div>

    <script>
        const currentUser = localStorage.getItem('componentsBayCurrentUser') || 'Unknown';
        const userRole = localStorage.getItem('componentsBayUserRole') || 'user';
        document.getElementById('userInfo').textContent = currentUser;

        // Admin only
        if (!currentUser || currentUser === 'Unknown') {
            window.location.href = 'index.html';
        } else if (userRole !== 'admin') {
            document.body.innerHTML = '<div style="text-align:center;padding:100px 20px;"><h2>⛔ Access Denied</h2><p>This page is restricted to administrators only.</p><a href="index.html" style="color:#2980b9;">← Back to Home</a></div>';
        } else {
            loadAll();
        }
            { name: 'EFS Float',      table: 'efs',            localKey: 'componentsBayEFS',          icon: '🎈', pnField: 'partNumber' },
            { name: 'EFS Cylinders',  table: 'efs_cylinders',  localKey: 'componentsBayEFSCylinders', icon: '🔵', pnField: 'partNumber' },
            { name: 'Life Raft',      table: 'liferafts',      localKey: 'componentsBayLifeRafts',    icon: '🛟', pnField: 'partNumber' },
            { name: 'Wheel',          table: 'wheels',         localKey: 'componentsBayWheel',        icon: '🔧', pnField: 'pnWheel' },
            { name: 'Troop Seat',     table: 'troopseats',     localKey: 'componentsBayTroopSeats',   icon: '💺', pnField: 'partNumber' },
            { name: 'Avionic',        table: 'avionic',        localKey: 'componentsBayAvionic',      icon: '📡', pnField: 'partNumber' },
            { name: 'Engine',         table: 'engine',         localKey: 'componentsBayEngine',       icon: '⚙️', pnField: 'partNumber' },
            { name: 'Rotor Bay',      table: 'rotorbay',       localKey: 'componentsBayRotorBay',     icon: '🚁', pnField: 'partNumber' },
            { name: 'Composite',      table: 'composite',      localKey: 'componentsBayComposite',    icon: '🔩', pnField: 'partNumber' },
            { name: 'Maintenance',    table: 'maintenance',    localKey: 'componentsBayMaintenance',  icon: '🛠️', pnField: 'partNumber' },
            { name: 'IAFT/EAFT',      table: 'iafteaft',       localKey: 'componentsBayIaftEaft',     icon: '📦', pnField: 'partNumber' },
            { name: 'POL',            table: 'pol',            localKey: 'componentsBayPOL',          icon: '🛢️', pnField: 'partNumber' },
            { name: 'Tools',          table: 'tools',          localKey: 'componentsBayTools',        icon: '🔨', pnField: 'partNumber' },
        ];

        async function loadModule(mod) {
            try {
                if (window.ComponentsBayDB) return await window.ComponentsBayDB.load(mod.table);
            } catch(e) {}
            return JSON.parse(localStorage.getItem(mod.localKey) || '[]');
        }

        function getNextDates(item, moduleName) {
            const dates = [];
            if (['EFS Float','EFS Cylinders'].includes(moduleName)) {
                if (item.next18M) dates.push(item.next18M);
                if (item.next36M) dates.push(item.next36M);
                if (item.next60M) dates.push(item.next60M);
            }
            if (item.nextInspection) dates.push(item.nextInspection);
            if (item.next18M && !['EFS Float','EFS Cylinders'].includes(moduleName)) dates.push(item.next18M);
            if (item.next24M) dates.push(item.next24M);
            if (item.next36M && !['EFS Float','EFS Cylinders'].includes(moduleName)) dates.push(item.next36M);
            if (item.next60M && !['EFS Float','EFS Cylinders'].includes(moduleName)) dates.push(item.next60M);
            if (item.next1Y) dates.push(item.next1Y);
            if (item.next2Y) dates.push(item.next2Y);
            if (item.inspectionData) {
                const id = item.inspectionData;
                ['next1M','next1Y','next18M','next3Y'].forEach(k => { if (id[k]) dates.push(id[k]); });
            }
            return [...new Set(dates)];
        }

        function createPieChart(canvasId, serviceable, unserviceable) {
            const total = serviceable + unserviceable;
            if (total === 0) return;
            const ctx = document.getElementById(canvasId).getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: unserviceable > 0 ? [serviceable, unserviceable] : [serviceable, 0],
                        backgroundColor: unserviceable > 0 ? ['#27ae60', '#e74c3c'] : ['#27ae60', '#e2e8f0'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '72%',
                    plugins: { legend: { display: false }, tooltip: { enabled: true } },
                    animation: { animateRotate: true, duration: 600 }
                }
            });
        }

        async function loadAll() {
            const today = new Date(); today.setHours(0,0,0,0);
            const in90 = new Date(today); in90.setDate(in90.getDate() + 90);

            let totalItems = 0, totalUS = 0, totalWithin90 = 0;
            const allWithin90 = [];
            const moduleStats = [];

            // Wait for DB
            await new Promise(resolve => {
                if (window.ComponentsBayDB) return resolve();
                let tries = 0;
                const iv = setInterval(() => {
                    if (window.ComponentsBayDB || ++tries > 30) { clearInterval(iv); resolve(); }
                }, 100);
            });

            for (const mod of MODULES) {
                const items = await loadModule(mod);
                const serviceable = items.filter(i => i.serviceability !== 'Unserviceable').length;
                const unserviceable = items.filter(i => i.serviceability === 'Unserviceable').length;
                totalItems += items.length;
                totalUS += unserviceable;
                moduleStats.push({ mod, items, serviceable, unserviceable });

                // Within 90 days
                items.forEach(item => {
                    if (item.serviceability === 'Unserviceable') return;
                    const dates = getNextDates(item, mod.name);
                    dates.forEach(d => {
                        const dt = new Date(d);
                        if (dt >= today && dt <= in90) {
                            const daysLeft = Math.ceil((dt - today) / 86400000);
                            allWithin90.push({ mod, item, date: d, daysLeft });
                            totalWithin90++;
                        }
                    });
                });
            }

            // Deduplicate within90 (keep earliest per item)
            const seen90 = new Set();
            const within90Deduped = allWithin90
                .sort((a,b) => a.daysLeft - b.daysLeft)
                .filter(({ mod, item, date }) => {
                    const key = `${mod.name}|${item.id}|${date}`;
                    if (seen90.has(key)) return false;
                    seen90.add(key); return true;
                });

            // Render stats
            document.getElementById('statRow').innerHTML = `
                <div class="stat-card blue"><div class="stat-value">${totalItems}</div><div class="stat-label">Total Items</div></div>
                <div class="stat-card green"><div class="stat-value">${totalItems - totalUS}</div><div class="stat-label">Serviceable</div></div>
                <div class="stat-card red"><div class="stat-value">${totalUS}</div><div class="stat-label">Unserviceable</div></div>
                <div class="stat-card orange"><div class="stat-value">${within90Deduped.length}</div><div class="stat-label">Due Within 90 Days</div></div>
            `;

            // Render charts
            const chartsHTML = moduleStats.map(({ mod, serviceable, unserviceable }) => {
                const total = serviceable + unserviceable;
                const pct = total > 0 ? Math.round((serviceable / total) * 100) : 100;
                return `
                    <div class="chart-card">
                        <h3>${mod.icon} ${mod.name}</h3>
                        <div class="chart-wrapper">
                            <canvas id="chart_${mod.table}" height="160"></canvas>
                            <div class="chart-center-label">
                                <div class="total">${pct}%</div>
                                <div class="label">OK</div>
                            </div>
                        </div>
                        <div class="chart-legend">
                            <div class="legend-item"><div class="legend-dot" style="background:#27ae60"></div><span style="color:#27ae60;font-weight:600;">${serviceable}</span> Svc</div>
                            <div class="legend-item"><div class="legend-dot" style="background:#e74c3c"></div><span style="color:#e74c3c;font-weight:600;">${unserviceable}</span> U/S</div>
                            <div class="legend-item"><div class="legend-dot" style="background:#94a3b8"></div>${total} Total</div>
                        </div>
                    </div>`;
            }).join('');
            document.getElementById('chartsGrid').innerHTML = chartsHTML;

            // Draw charts after DOM update
            setTimeout(() => {
                moduleStats.forEach(({ mod, serviceable, unserviceable }) => {
                    createPieChart(`chart_${mod.table}`, serviceable, unserviceable);
                });
            }, 50);

            // Render Within 90 Days
            document.getElementById('within90Badge').textContent = within90Deduped.length;
            if (within90Deduped.length === 0) {
                document.getElementById('within90Content').innerHTML = '<div style="text-align:center;padding:30px;color:#94a3b8;">✅ No inspections due in the next 90 days</div>';
            } else {
                let html = `<div style="overflow-x:auto;"><table class="within90-table">
                    <thead><tr><th>Module</th><th>Designation</th><th>P/N</th><th>S/N</th><th>Due Date</th><th>Days Left</th></tr></thead>
                    <tbody>`;
                within90Deduped.forEach(({ mod, item, date, daysLeft }) => {
                    const pn = item.pnWheel || item.partNumber || '-';
                    const dayClass = daysLeft <= 30 ? 'days-red' : daysLeft <= 60 ? 'days-orange' : 'days-green';
                    html += `<tr>
                        <td><span class="module-badge">${mod.icon} ${mod.name}</span></td>
                        <td>${item.designation || '-'}</td>
                        <td>${pn}</td>
                        <td>${item.serialNumber || '-'}</td>
                        <td>${date}</td>
                        <td><span class="days-badge ${dayClass}">${daysLeft}d</span></td>
                    </tr>`;
                });
                html += '</tbody></table></div>';
                document.getElementById('within90Content').innerHTML = html;
            }
        }

    </script>
</body>
</html>
